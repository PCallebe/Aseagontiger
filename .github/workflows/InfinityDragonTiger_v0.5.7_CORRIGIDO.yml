name: DragonTigerApp - Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DragonTigerApp_v0.5.7_CORRIGIDO.zip'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

concurrency:
  group: dragon-tiger-apk
  cancel-in-progress: false

jobs:
  build:
    name: Compilar DragonTigerApp
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      PROJECT_ZIP: DragonTigerApp_v0.5.7_CORRIGIDO.zip
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas e ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar e extrair ZIP do projeto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$PROJECT_ZIP" ]; then
            echo "::error::Arquivo $PROJECT_ZIP não encontrado na raiz do repositório."
            echo "ZIPs disponíveis na raiz:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/dragon-tiger-unpacked"
          unzip -q "$PROJECT_ZIP" -d "$RUNNER_TEMP/dragon-tiger-unpacked"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/dragon-tiger-unpacked" -maxdepth 5 -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::O ZIP não contém settings.gradle.kts."
            find "$RUNNER_TEMP/dragon-tiger-unpacked" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          rsync -a --delete "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'applicationId = "com.infinity.dragontiger"' app/build.gradle.kts

      - name: Verificar ambiente
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compilar Kotlin
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Gerar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/verification
          sha256sum "$APK" | tee build/verification/apk-sha256.txt
          stat --printf='APK bytes: %s\n' "$APK" | tee build/verification/apk-size.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/apk-size.txt
          if-no-files-found: error
          retention-days: 30
