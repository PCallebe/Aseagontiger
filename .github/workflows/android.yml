name: DesfonTiger - PROTÓTICO Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK (sem pacote obsoleto 'tools')
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Configurar Gradle 8.9 (compatível com AGP 8.7.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: |
          cd DesfonTiger_PROTOTICO
          gradle --no-daemon --stacktrace assembleDebug

      - name: Renomear APK
        run: cp DesfonTiger_PROTOTICO/app/build/outputs/apk/debug/app-debug.apk DesfonTiger-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DesfonTiger-APK
          path: DesfonTiger-debug.apk
          if-no-files-found: error
          retention-days: 30
