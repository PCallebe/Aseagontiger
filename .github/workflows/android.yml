
name: Construir DesfonTiger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="DesfonTiger_PROTOTICO_V0.1_OFFLINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: arquivo ZIP não encontrado: $ZIP_FILE"
            exit 1
          fi

          mkdir -p projeto-extraido
          unzip -o "$ZIP_FILE" -d projeto-extraido

          echo "Conteúdo extraído:"
          find projeto-extraido -maxdepth 3 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -e

          ROOT="projeto-extraido"

          SETTINGS=$(find "$ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts não encontrado."
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/build.gradle" ] && \
             [ ! -f "$PROJECT/build.gradle.kts" ]; then
            echo "ERRO: arquivo build.gradle não encontrado na raiz do projeto."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERRO: módulo app não encontrado."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "Projeto Android localizado em: $PROJECT"

      - name: Preparar Gradle
        shell: bash
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Preparar e compilar APK
        shell: bash
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Localizar APK gerado
        id: apk
        shell: bash
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          set -e

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "arquivo=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DesfonTiger-APK
          path: ${{ steps.projeto.outputs.dir }}/${{ steps.apk.outputs.arquivo }}
          if-no-files-found: error
          retention-days: 7
