
name: Gerar APK Dragon Tiger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -eu

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          "$SDKMANAGER" --version

          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_EXIT=$?
          set -e

          if [ "$LICENSE_EXIT" -ne 0 ]; then
            echo "Falha ao aceitar licencas do SDK."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto
        shell: bash
        run: |
          set -eu

          test -f InfinityDragonTiger_v1.zip || {
            echo "ERRO: InfinityDragonTiger_v1.zip ausente na raiz."
            exit 1
          }

          mkdir -p projeto
          unzip -q InfinityDragonTiger_v1.zip -d projeto

          test -f projeto/settings.gradle.kts
          test -f projeto/app/build.gradle.kts
          test -f projeto/app/src/main/AndroidManifest.xml

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -eu
          gradle -p projeto --no-daemon \
            :app:assembleDebug --stacktrace

      - name: Validar APK
        shell: bash
        run: |
          set -eu
          APK="projeto/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          mkdir -p saida
          cp "$APK" saida/DragonTiger-debug.apk
          sha256sum saida/DragonTiger-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTiger-debug-APK
          path: saida/DragonTiger-debug.apk
          if-no-files-found: error
          retention-days: 14
