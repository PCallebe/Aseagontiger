name: Compilar InfinityAppPro Dragon Tiger v187

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validar ZIP
        shell: bash
        run: |
          ZIP="InfinityAppPro_DRAGON_TIGER_v187.zip"
          test -f "$ZIP" || { echo "ERRO: $ZIP nao esta na raiz do repositorio"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          echo "ZIP valido"

      - name: Descompactar projeto
        shell: bash
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q "InfinityAppPro_DRAGON_TIGER_v187.zip" -d projeto

      - name: Validar Dragon Tiger
        shell: bash
        run: |
          grep -q 'versionCode = 187' projeto/app/build.gradle.kts
          grep -q 'versionName = "17.0-dragon-tiger"' projeto/app/build.gradle.kts
          test -f projeto/app/src/main/java/com/example/siyaheatradar/DragonTigerVision.kt
          grep -q 'DragonTigerVision.detect(bmp)' projeto/app/src/main/java/com/example/siyaheatradar/SiyaAnalyzerService.kt
          grep -q 'dt_latest_prediction' projeto/app/src/main/java/com/example/siyaheatradar/SiyaAnalyzerService.kt
          test -f projeto/app/src/main/res/drawable-nodpi/infinity_launcher.png
          echo "Dragon Tiger v187 validado"

      - name: Compilar APK
        shell: bash
        run: |
          cd projeto
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK
        shell: bash
        run: |
          APK="projeto/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERRO: APK nao foi gerado"; exit 1; }
          mkdir -p apk
          cp "$APK" apk/InfinityAppPro-DRAGON-TIGER-v187.apk
          sha256sum apk/InfinityAppPro-DRAGON-TIGER-v187.apk > apk/SHA256.txt
          ls -lh apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityAppPro-DRAGON-TIGER-v187-APK
          path: |
            apk/InfinityAppPro-DRAGON-TIGER-v187.apk
            apk/SHA256.txt
          if-no-files-found: error
          retention-days: 30
          
