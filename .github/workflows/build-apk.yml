
      - name: Localizar e configurar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          else
            APP_BUILD=$(find . -type f \
              \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
              -not -path '*/.gradle/*' | head -n 1)

            if [ -z "$APP_BUILD" ]; then
              echo "ERRO: Não foi encontrado settings.gradle nem app/build.gradle."
              echo "Arquivos Gradle encontrados:"
              find . -type f \
                \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
                -not -path '*/.gradle/*' -print
              exit 1
            fi

            PROJECT=$(dirname "$(dirname "$APP_BUILD")")

            cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DesfonTiger"
          include(":app")
          EOF
          fi

          echo "Projeto localizado em: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          
