
name: DragonTigerApp - APK v0.1 Offline

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validar fonte e compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo "::error::Nenhum ZIP encontrado na raiz do repositório"; exit 1; }

          mkdir -p "$RUNNER_TEMP/dragon-tiger"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/dragon-tiger"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/dragon-tiger" -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "::error::settings.gradle ou settings.gradle.kts não encontrado"; exit 1; }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          rsync -a "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          test -s settings.gradle -o -s settings.gradle.kts
          test -s app/build.gradle -o -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml

      - name: Compilar projeto
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/verification
          cp "$APK" build/verification/DragonTigerApp-Prototipo-V0.1-Offline.apk
          sha256sum build/verification/DragonTigerApp-Prototipo-V0.1-Offline.apk > build/verification/sha256.txt

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-Prototipo-V0.1-Offline
          path: build/verification/
          if-no-files-found: error
          retention-days: 30
