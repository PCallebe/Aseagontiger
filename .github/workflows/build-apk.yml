
name: Construir DesfonTiger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android necessários
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Localizar projeto Android
        shell: bash
        run: |
          PROJECT=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "::error::settings.gradle não encontrado no repositório."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android encontrado:"
          echo "$PROJECT_DIR"

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Arquivo build.gradle não encontrado na raiz do projeto."
            exit 1
          fi

          echo "Estrutura do projeto localizada."

      - name: Compilar APK Debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK Debug foi gerado."
            exit 1
          fi

          echo "APK GERADO COM SUCESSO:"
          echo "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DesfonTiger-PROTOTICO-V0.1-OFFLINE
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
