
name: Construir DesfonTiger APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DesfonTiger-Prototico-V0.1-Offline-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
