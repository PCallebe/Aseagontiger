name: DragonTigerApp - Android APK
run-name: DragonTigerApp APK - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.9'

concurrency:
  group: dragontiger-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 / Gradle 8.9 / Android 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Não usar android-actions/setup-android aqui: essa action falhou ao
      # executar sdkmanager no runner. O SDK pré-instalado do Ubuntu é usado
      # diretamente, com sdk_root explícito em todas as chamadas.
      - name: Preparar Android SDK sem setup-android
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="$ANDROID_HOME"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager não encontrado em $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK_ROOT=$SDK_ROOT"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Diagnóstico do ambiente Android
        shell: bash
        run: |
          set -Eeuo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Validar estrutura e identidade do projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_dragon_tiger.xml
          test -s app/src/main/java/com/infinity/dragontiger/MainActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/HistoryActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/CaptureOverlayService.kt
          test -s app/src/main/java/com/infinity/dragontiger/SequenceStore.kt
          test -s app/src/main/java/com/infinity/dragontiger/ScreenOcrReader.kt
          grep -q 'namespace = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'applicationId = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'versionName = "0.5.3"' app/build.gradle.kts

      - name: Resolver dependências e compilar Kotlin
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:compileDebugKotlin

      - name: Gerar APK Debug
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/verification
          sha256sum "$APK" | tee build/verification/apk-sha256.txt
          stat --printf='APK bytes: %s\n' "$APK" | tee build/verification/apk-size.txt

      - name: Publicar APK e comprovantes
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-APK-v0.5.3-SDKFIX
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/apk-size.txt
          if-no-files-found: error
          retention-days: 30
