name: DragonTigerApp - Android APK
run-name: DragonTigerApp APK - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

concurrency:
  group: dragontiger-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 / Gradle 8.9 / SDK 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # O runner ubuntu-24.04 já fornece Android SDK. Não reinstalar
      # cmdline-tools nem executar sdkmanager: isso era o ponto de falha.
      - name: Validar SDK Android pré-instalado
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK ausente em $ANDROID_HOME"; exit 1; }
          test -d "$ANDROID_HOME/platform-tools" || { echo "platform-tools ausente"; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "Android platform 35 ausente no runner"; ls -la "$ANDROID_HOME/platforms" || true; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "Build Tools 35.0.0 ausente no runner"; ls -la "$ANDROID_HOME/build-tools" || true; exit 1; }
          echo "SDK Android 35 validado. Nenhuma instalação via sdkmanager necessária."

      - name: Diagnóstico do ambiente
        shell: bash
        run: |
          set -Eeuo pipefail
          java -version
          gradle --version
          echo "SDK platforms:"; ls -1 "$ANDROID_HOME/platforms"
          echo "SDK build-tools:"; ls -1 "$ANDROID_HOME/build-tools"

      - name: Validar estrutura e identidade do projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_dragon_tiger.xml
          test -s app/src/main/java/com/infinity/dragontiger/MainActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/HistoryActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/CaptureOverlayService.kt
          test -s app/src/main/java/com/infinity/dragontiger/SequenceStore.kt
          test -s app/src/main/java/com/infinity/dragontiger/ScreenOcrReader.kt
          grep -q 'namespace = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'applicationId = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'versionName = "0.5.3"' app/build.gradle.kts

      - name: Compilar Kotlin
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all :app:compileDebugKotlin
        timeout-minutes: 20

      - name: Gerar APK Debug
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/verification
          sha256sum "$APK" | tee build/verification/apk-sha256.txt
          stat --printf='APK bytes: %s\n' "$APK" | tee build/verification/apk-size.txt
        timeout-minutes: 20

      - name: Publicar APK e comprovantes
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-APK-v0.5.3
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/apk-size.txt
          if-no-files-found: error
          retention-days: 30
