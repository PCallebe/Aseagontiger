name: DragonTigerApp - APK
run-name: DragonTigerApp - build ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

concurrency:
  group: dragontiger-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verificar estrutura e identidade do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_dragon_tiger.xml
          test -s app/src/main/java/com/infinity/dragontiger/MainActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/HistoryActivity.kt
          test -s app/src/main/java/com/infinity/dragontiger/CaptureOverlayService.kt
          test -s app/src/main/java/com/infinity/dragontiger/SequenceStore.kt
          test -s app/src/main/java/com/infinity/dragontiger/ScreenOcrReader.kt
          grep -q 'namespace = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'applicationId = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'android:icon="@drawable/ic_dragon_tiger"' app/src/main/AndroidManifest.xml
          echo 'Estrutura DragonTigerApp validada.'

      - name: Compilar Kotlin e gerar APK (Gradle 8.9)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: >-
            --no-daemon
            --stacktrace
            --warning-mode all
            :app:compileDebugKotlin
            :app:assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-APK-v0.5.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
