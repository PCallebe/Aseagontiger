name: DragonTigerApp - Gerar APK (ZIP na raiz)

on:
  workflow_dispatch:
  push:
    paths:
      - 'DragonTigerApp_v0.5.6_COMPLETO.zip'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extrair projeto e compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: DragonTigerApp_v0.5.6_COMPLETO.zip

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair ZIP do projeto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$PROJECT_ZIP" ]; then
            echo "ERRO: não encontrei $PROJECT_ZIP na raiz do repositório."
            echo "Arquivos ZIP encontrados na raiz:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dragon-tiger-unpacked"
          unzip -q "$PROJECT_ZIP" -d "$RUNNER_TEMP/dragon-tiger-unpacked"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/dragon-tiger-unpacked" -maxdepth 4 -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: o ZIP não contém settings.gradle.kts."
            find "$RUNNER_TEMP/dragon-tiger-unpacked" -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Projeto localizado em: $PROJECT_DIR"
          rsync -a --exclude='.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"
          test -s "$GITHUB_WORKSPACE/settings.gradle.kts"
          echo "ZIP extraído automaticamente. Nenhuma extração manual é necessária."

      - name: Validar Android SDK pré-instalado
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "ERRO: Android SDK não encontrado no runner."; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "ERRO: Android SDK Platform 35 ausente no runner.";
            ls -la "$ANDROID_HOME/platforms" || true;
            exit 1;
          }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "ERRO: Android Build Tools 35.0.0 ausentes no runner.";
            ls -la "$ANDROID_HOME/build-tools" || true;
            exit 1;
          }
          echo "Android SDK 35 e Build Tools 35.0.0 encontrados."

      - name: Validar estrutura e identidade do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s build.gradle.kts
          test -s gradle.properties
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.infinity.dragontiger"' app/build.gradle.kts
          grep -q 'applicationId = "com.infinity.dragontiger"' app/build.gradle.kts
          echo "Estrutura do DragonTigerApp validada."

      - name: Compilar Kotlin
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Gerar e verificar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build/verification
          sha256sum "$APK" | tee build/verification/apk-sha256.txt
          stat --printf='APK bytes: %s\n' "$APK" | tee build/verification/apk-size.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerApp-APK-v0.5.6
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/apk-size.txt
          if-no-files-found: error
          retention-days: 30
