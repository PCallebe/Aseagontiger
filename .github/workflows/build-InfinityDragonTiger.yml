name: Gerar APK Infinity Dragon Tiger

on:
  workflow_dispatch:
  push:
    paths:
      - 'InfinityDragonTiger_v1.zip'
      - '.github/workflows/InfinityDragonTiger.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar e descompactar projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f InfinityDragonTiger_v1.zip || { echo 'ERRO: InfinityDragonTiger_v1.zip precisa estar na raiz do repositório.'; exit 1; }
          mkdir -p projeto
          unzip -q InfinityDragonTiger_v1.zip -d projeto
          test -f projeto/settings.gradle.kts
          test -f projeto/app/src/main/AndroidManifest.xml
          test -f projeto/app/src/main/java/com/infinity/dragontiger/CaptureOverlayService.kt
          echo 'Projeto encontrado e descompactado.'

      - name: Compilar APK
        run: gradle -p projeto --no-daemon :app:assembleDebug

      - name: Validar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK='projeto/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p saida
          cp "$APK" saida/InfinityDragonTiger-debug.apk
          sha256sum saida/InfinityDragonTiger-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: InfinityDragonTiger-debug-APK
          path: saida/InfinityDragonTiger-debug.apk
          if-no-files-found: error
          retention-days: 14
